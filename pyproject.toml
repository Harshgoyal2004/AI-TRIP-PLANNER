[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Agentic trip planner: LangGraph + FastAPI backend with a Streamlit frontend"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests are opt-in: `pytest -m integration` (real APIs) or `pytest -m e2e` (full agent run).
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: calls real external APIs (needs API keys in .env)",
    "e2e: full agent run through the LLM (slow, uses LLM tokens)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
